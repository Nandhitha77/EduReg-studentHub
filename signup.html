<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Portal</title>
    <meta charset="UTF-8">
    <link rel="icon" href="./image/Icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="add.css">
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <img src="./image/Icon.png" alt="EduReg Logo">
                <div class="logo-text">
        <h1>EduReg</h1>
        <p>Your Academic Journey Starts Here.</p>
    </div>
            </div>

            <div class="registration-title">
                <h3>Student Registration</h3>
            </div>
        </div>

        <!-- LEFT SECTION -->
        <div class="leftSection">
            <h2>Learn • Grow • Achieve</h2>

            <p>
                Join EduReg and take the
                next step towards your dreams!
            </p>

            <div class="illustration">
                <!-- Add your graduation cap and books image here -->
                <img src="./image/Logo!.png" alt="Graduation cap and books">
            </div>
        </div>

        <div class="rightSection">
            <form id="signupForm">
                <input type="text" id="fullName" placeholder="Full Name" required>

                <input type="text" id="registerNumber" placeholder="Register Number" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="tel" id="mobile" placeholder="Mobile Number" pattern="[6-9][0-9]{9}" maxlength="10"
                    title="Enter a valid 10-digit Indian mobile number" required>

                <select id="department"  required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="AIDS">AI & DS</option>
                    <option value="MTECH">M.Tech</option>
                </select>

                <select id="studyear" required>
                    <option value="" disabled selected>Year of Study</option>
                    <option value="1">1st year</option>
                    <option value="2">2nd year</option>
                    <option value="3">3rd year</option>
                    <option value="4">4th year</option>
                </select>
                <div class="password-field">
    <input type="password" id="password" placeholder="Password" required>
    <button type="button" class="toggle-pw" aria-label="Show password">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
    </button>
</div>

<div class="password-field">
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button type="button" class="toggle-pw" aria-label="Show password">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
    </button>
</div>
               
                <div class="gender">
                    <label>Gender:</label>
                    <input type="radio" id="male" value="Male" name="gender" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" value="Female" name="gender" required>
                    <label for="female">Female</label>

                    <input type="radio" id="other" value="Other" name="gender" required>
                    <label for="other">Other</label>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms and conditions</a></label>
                </div>

                <button type="button" class="register-btn" onclick="register()">Register</button>

                <p class="login-link">Already have an account? <a href="value.html">Login</a></p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
