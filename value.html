<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>EduReg</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./image/Icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
   <div class="login-box">
    <form onsubmit="login(); return false;">
        <h2>Student Login</h2>
        <div class="input-box">
            <span class="icon">
                <ion-icon name="mail"></ion-icon>
            </span>
            <input type="email" id="loginEmail"required placeholder=" ">
            <label>Email</label>
        </div>
        <div class="input-box">
            <span class="icon" id="togglePassword" onclick="showHidePassword()">
                <ion-icon name="lock-closed"></ion-icon>
            </span>
            <input type="password" id="password" required minlength="8" maxlength="20" placeholder=" ">
            <label>Password</label>
        </div>
        <div class="remember">
            <label><input type="checkbox">Remember me</label>
            <a href="#" >Forgot Password?</a>
        </div>
        <button type="submit">Login</button>
        <div class="register-link">
            <p>Don't have an account?
            <a href="index.html">Register</a></p>
        </div>
    </form>

   </div>
</section>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script src="login.js"></script>
</body>


</html>
